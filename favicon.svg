<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Icon-Form als Clip (25 % Rundung = rx 64) -->
    <clipPath id="icon-clip">
      <rect width="256" height="256" rx="64"/>
    </clipPath>

    <!-- Blob-Blur für Liquid-Effekt -->
    <filter id="blob-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>

    <!-- Leichter Drop Shadow auf dem Text -->
    <filter id="text-depth" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5"
                    flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <!-- Diagonaler Hintergrund-Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#edfff8"/>
      <stop offset="100%" stop-color="#f0eeff"/>
    </linearGradient>

  </defs>

  <!-- Basis: gerundetes Quadrat mit Gradient -->
  <rect width="256" height="256" rx="64" fill="url(#bg-grad)"/>

  <!-- Liquid-Schichten, auf Icon geclipt -->
  <g clip-path="url(#icon-clip)">

    <!-- Grüner Blob, oben-rechts -->
    <ellipse cx="218" cy="44" rx="115" ry="100"
             fill="#22C55E" opacity="0.26"
             filter="url(#blob-blur)"/>

    <!-- Indigo-Blob, unten-links -->
    <ellipse cx="38" cy="218" rx="115" ry="100"
             fill="#818CF8" opacity="0.22"
             filter="url(#blob-blur)"/>

    <!-- Glas-Highlight oben (Lichtreflexion) -->
    <ellipse cx="128" cy="-10" rx="140" ry="60"
             fill="#ffffff" opacity="0.60"
             filter="url(#blob-blur)"/>

  </g>

  <!-- Text, zentriert, mit Tiefenwirkung -->
  <g transform="translate(128, 128) scale(1.4) translate(-145, -41)"
     filter="url(#text-depth)">
    <text x="74" y="48"
          font-family="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30"
          font-weight="600"
          fill="#0F172A">Papyr</text>
    <text x="152" y="48"
          font-family="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30"
          font-weight="700"
          fill="#22C55E">.</text>
    <text x="162" y="48"
          font-family="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30"
          font-weight="500"
          letter-spacing="0.08em"
          fill="#475569">bck</text>
  </g>

  <!-- Kantendefinition: heller Stroke auf gerundeter Form -->
  <rect width="256" height="256" rx="64"
        fill="none" stroke="#bbf7d0" stroke-width="2"/>

</svg>
